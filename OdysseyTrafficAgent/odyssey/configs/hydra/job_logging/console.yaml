# Hydra's default job logging without its file handler: the launcher already captures stdout
# into simulation.log, so <output_dir>/<job>.log would be a second copy of the same lines.
version: 1
formatters:
  simple:
    format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    formatter: simple
    stream: ext://sys.stdout
root:
  level: INFO
  handlers: [console]

disable_existing_loggers: false
