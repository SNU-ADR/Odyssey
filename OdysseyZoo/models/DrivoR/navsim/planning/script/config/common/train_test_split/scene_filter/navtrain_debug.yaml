# Small fixed navtrain subset for smoke tests (train_*.sh <arm> smoke).
#
# Same filter settings as navtrain (has_route, 4 history / 10 future frames), so a cache built
# here has the same structure as a full navtrain cache. Every listed token has all 8 cameras at
# all 4 history frames, so the subset works with any model's sensor config.
_target_: navsim.common.dataclasses.SceneFilter
_convert_: 'all'
num_history_frames: 4
num_future_frames: 10
frame_interval: 1
has_route: true
max_scenes: null
