# Agent config for the Odyssey benchmark. See docs/getting_started.md "Port your model".
# Paths may use ${VAR} and ~; relative paths are taken from this file's directory.
# LTF (TransFuser, latent camera-only). The sdroute arm reads the SD route in `targets` and drops the command.
model:
  name: ltf_sdroute
  python: ${ODYSSEY_PLANNER_PY}
  repo: ${ODYSSEY_ZOO_ROOT}/models/navsim
  agent_config: ltf_sdroute_agent
  checkpoint: ${ODYSSEY_MODELS_ROOT}/models/navsim/ckpts/ltf_sdroute.ckpt
  overrides: []
history_times_s: [-1.5, -1.0, -0.5, 0.0]
camera_times_s: {CAM_F0: [0.0], CAM_L0: [0.0], CAM_R0: [0.0]}
navigation: {driving_command: false, sd_route: targets}
output: {plan_dt: 0.5, shape: [8, 3]}
feature_shapes:
  camera_feature: [1, 3, 256, 1024]
  status_feature: [1, 8]
